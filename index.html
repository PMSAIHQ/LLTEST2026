 let pool=cat.startsWith('All')?Q:cat.startsWith('Weak')?Q.filter(q=>w.includes(q.id)):Q.filter(q=>q.c===cat);
 if(type==='txt')pool=pool.filter(q=>q.k==='text');if(type==='fwd'||type==='rev')pool=pool.filter(q=>q.k!=='text');
 if(!pool.length){alert('No questions match these settings yet.');return}
 const nv=$('#nsel').value,n=nv==='All'?pool.length:Math.min(+nv,pool.length);
 const items=sh(pool).map(q=>pick(q,hard,trap,type)).filter(Boolean).slice(0,n);
 S={items,i:0,sc:0,hard,tOn:$('#timer').checked,lim:hard?15:30,log:[],t0:Date.now()};show()}
function show(){clearInterval(tm);const it=S.items[S.i];S.ans=false;S.qs=Date.now();
 const rev=it.k==='rev';
 $('#app').innerHTML=`<div class="top"><span>Question ${S.i+1} / ${S.items.length}</span><span>Score ${S.sc}</span><span id="tl">${S.tOn?S.lim+'s':'No timer'}</span></div><div class="bar"><i id="tb"></i></div>
 <div class="card"><div><span class="tag">${it.q.c}</span>${it.trap?'<span class="tag">⚠ trap</span>':''}</div><p class="q">${it.p}</p>${!rev&&it.q.i>=0?`<span class="qi" style="text-align:center">${img(it.q.i)}</span>`:''}
 <div class="${rev?'og':''}" id="opts">${it.o.map((o,j)=>`<button class="o" onclick="ans(${j})">${o.im!==undefined?img(o.im):o.t}</button>`).join('')}</div><div id="fb"></div></div>`;
 if(S.tOn){let left=S.lim;$('#tb').style.transition='none';tm=setInterval(()=>{left-=.1;$('#tb').style.width=Math.max(0,left/S.lim*100)+'%';$('#tl').textContent=Math.ceil(left)+'s';if(left<=0){clearInterval(tm);ans(-1)}},100)}}
function ans(j){if(S.ans)return;S.ans=true;clearInterval(tm);const it=S.items[S.i],okj=it.o.findIndex(o=>o.ok),good=j===okj,sk=j<0,w=ld('dt_wrong',[]);
 if(good)S.sc++;else if(!sk&&S.hard)S.sc--;
 S.log.push({id:it.q.id,c:it.q.c,ok:good,sk,it,t:(Date.now()-S.qs)/1000});
 sv('dt_wrong',good?w.filter(x=>x!==it.q.id):[...new Set([...w,it.q.id])]);
 document.querySelectorAll('#opts .o').forEach((b,k)=>{b.disabled=true;if(k===okj)b.classList.add('ok');else if(k===j)b.classList.add('no')});
 $('#fb').innerHTML=`<div class="fb ${good?'ok':'no'}">${good?'Correct ✓':sk?'Time’s up — not answered':'Wrong ✗'}</div><button class="pri" onclick="nx()">${S.i+1<S.items.length?'Next →':'Finish'}</button>`}
function nx(){S.i++;S.i<S.items.length?show():fin()}
function fin(){const n=S.items.length,sc=Math.max(0,S.sc),p=Math.round(sc/n*100),by={};
 S.log.forEach(l=>{by[l.c]=by[l.c]||[0,0];by[l.c][1]++;if(l.ok)by[l.c][0]++});
 const h=ld('dt_hist',[]);h.push({d:new Date().toLocaleDateString(),s:sc,n,p,h:S.hard});sv('dt_hist',h.slice(-30));
 const bad=S.log.filter(l=>!l.ok),at=(S.log.reduce((a,l)=>a+l.t,0)/n).toFixed(1);
 $('#app').innerHTML=`<h1>Result</h1><div class="card"><div class="big" style="color:var(${p>=70?'--ok':'--no'})">${sc}/${n} · ${p}%</div><p class="mu" style="text-align:center">${p>=70?'Pass mark reached (70%)':'Below the 70% pass mark'} · avg ${at}s per question${S.hard?' · hard mode (−1 per wrong)':''}</p></div>
 <div class="card"><h2 style="margin-top:0">By category</h2>${Object.entries(by).map(([c,v])=>`<div class="row"><span>${c}</span><span>${v[0]}/${v[1]} · ${Math.round(v[0]/v[1]*100)}%</span></div>`).join('')}</div>
 <div class="card"><h2 style="margin-top:0">Review mistakes (${bad.length})</h2>${bad.map(l=>{const it=l.it,c=it.o.find(o=>o.ok);return `<div class="rv"><b>${it.p}</b>${it.k==='rev'?'':(it.q.i>=0?' '+img(it.q.i):'')}<br>Correct: ${c.im!==undefined?img(c.im):c.t}${l.sk?' <span class="mu">(not answered)</span>':''}</div>`}).join('')||'<p class="mu">No mistakes — well done!</p>'}</div>
 <div class="grid"><button class="pri" onclick="home()">Home</button><button class="pri" onclick="home()">New test</button></div>`;
 document.getElementById('app').dataset.done=1}
home();
</script></body></html>
